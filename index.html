<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>受験校プランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============================================================
   設定の初期値（ふだんは教員ページの「システム設定」で変更します）
   ============================================================ */
window.CONFIG = {
  // 大学データ（Excel）。GitHub Pages に置くなら相対パスのままでOK
  MASTER_URL: 'data/master.xlsx',
  // 画面に出す学校名
  SCHOOL: '',
  // 組の選択肢。空配列なら自由入力
  CLASSES: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'],
  // 教員ページのパスワード（ハッシュ）。教員ページの「システム設定」から変更できます（初期値 takumi）
  TEACHER_PW_HASH: '196bb376a8e3a2f97aea46dcb5ad0a593c16aaf136d48ff20e6da64f810253d5',
  // 設定ファイルと公開先（教員ページの「システム設定」で保存すると data/config.json が上の値より優先されます）
  CONFIG_URL: 'data/config.json',
  GITHUB_REPO: 'nu1school/jukenko',
  GITHUB_BRANCH: 'main',
  // Firebase（Google）での提出・自動受け取り。システム設定で入れると config.json に保存されます
  FB_API_KEY: '',
  FB_PROJECT_ID: ''
};
</script>
<style>
/* 受験票のような落ち着いた紙面：藍のインクに、4種類の日程（出願・試験・発表・手続）だけを色で区別する */
:root{
  --paper:#f4f6f9; --surface:#ffffff; --sunken:#eef1f6; --ink:#1a2333; --muted:#5a6578; --line:#d6dce6;
  --ai:#24498c; --ai-ink:#ffffff; --ai-soft:#e3eaf6;
  --c-apply:#a86512; --c-apply-soft:#fbefdc;
  --c-exam:#24498c; --c-exam-soft:#e3eaf6;
  --c-ann:#2d7a4f; --c-ann-soft:#e0f1e6;
  --c-proc:#b03a62; --c-proc-soft:#f8e4ec;
  --c-kyo:#6a4bb0; --c-kyo-soft:#ece6f8;
  --warn:#9a5b00; --warn-soft:#fdf1d8; --danger:#b42318; --danger-soft:#fde7e4; --ok:#2d7a4f;
  --f-head:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"BIZ UDGothic","BIZ UDPGothic",ui-monospace,monospace;
  --r:8px; --chipmix:18%; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151c; --surface:#1a2029; --sunken:#151a22; --ink:#e7eaf0; --muted:#9ba5b6; --line:#2d3542;
  --ai:#8eaeea; --ai-ink:#0f1520; --ai-soft:#22304a;
  --c-apply:#e3a857; --c-apply-soft:#3a2c17; --c-exam:#8eaeea; --c-exam-soft:#22304a;
  --c-ann:#6cc794; --c-ann-soft:#1b3326; --c-proc:#e58aa9; --c-proc-soft:#3a1e2a; --c-kyo:#b39cf0; --c-kyo-soft:#2b2440;
  --warn:#f0b75a; --warn-soft:#382a12; --danger:#f19185; --danger-soft:#3b1d1a; --ok:#6cc794;
  --shadow:0 1px 2px rgba(0,0,0,.3); --chipmix:34%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#11151c; --surface:#1a2029; --sunken:#151a22; --ink:#e7eaf0; --muted:#9ba5b6; --line:#2d3542;
  --ai:#8eaeea; --ai-ink:#0f1520; --ai-soft:#22304a;
  --c-apply:#e3a857; --c-apply-soft:#3a2c17; --c-exam:#8eaeea; --c-exam-soft:#22304a;
  --c-ann:#6cc794; --c-ann-soft:#1b3326; --c-proc:#e58aa9; --c-proc-soft:#3a1e2a; --c-kyo:#b39cf0; --c-kyo-soft:#2b2440;
  --warn:#f0b75a; --warn-soft:#382a12; --danger:#f19185; --danger-soft:#3b1d1a; --ok:#6cc794;
  --shadow:0 1px 2px rgba(0,0,0,.3); --chipmix:34%; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.65 var(--f-body);-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:700;text-wrap:balance;margin:0;line-height:1.35}
a{color:var(--ai)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:19px;letter-spacing:.04em}
.brand .yr{font-family:var(--f-num);font-size:12px;color:var(--muted);letter-spacing:.08em}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.who b{font-weight:700}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.save.err{color:var(--danger)}
.okmsg{color:var(--ok);font-weight:700}
#submitState .w{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 14px;cursor:pointer;line-height:1.3;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ai)}
.btn.primary{background:var(--ai);color:var(--ai-ink);border-color:var(--ai);font-weight:700}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.notice{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:var(--r);padding:8px 12px;font-size:13px;margin:12px 0}
.notice.info{background:var(--ai-soft);border-color:color-mix(in srgb,var(--ai) 30%,transparent)}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:14px 0 16px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ai)}
.tab .cnt{font-family:var(--f-num);font-size:12px;background:var(--sunken);border-radius:10px;padding:0 7px;margin-left:4px;color:var(--muted)}

/* login */
.login{max-width:440px;margin:7vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:28px 24px}
.login h1{font-size:26px;letter-spacing:.05em}
.login .sub{color:var(--muted);font-size:13px;margin:4px 0 18px}
.stamp{display:inline-block;border:2px solid var(--c-proc);color:var(--c-proc);font-family:var(--f-head);font-weight:700;font-size:12px;padding:1px 8px;border-radius:4px;transform:rotate(-4deg);margin-left:8px;vertical-align:middle}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted);font-weight:700}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 11px}
.inp:focus{border-color:var(--ai);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err-msg{color:var(--danger);font-size:13px;min-height:1.4em}
.linkbtn{background:none;border:0;color:var(--ai);cursor:pointer;padding:0;text-decoration:underline;font-size:13px}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.tile .v{font-family:var(--f-num);font-size:22px;font-weight:700;line-height:1.3}
.tile .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* plan */
.plan{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:960px){.plan{grid-template-columns:minmax(0,1fr)}}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px;flex-wrap:wrap}
.sec-h h2{font-size:18px}
.sec-h .hint{font-size:12px;color:var(--muted)}
.pick{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.pick.ng{opacity:.62}
.dateblk{text-align:center;border-right:1px dashed var(--line);padding-right:10px}
.dateblk .m{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.dateblk .d{font-family:var(--f-num);font-size:26px;font-weight:700;line-height:1.1;color:var(--c-exam)}
.dateblk .wd{font-size:12px;color:var(--muted)}
.dateblk.kyo .d{font-size:17px;color:var(--c-kyo);padding-top:6px}
.pick .u{font-family:var(--f-head);font-weight:700;font-size:17px}
.pick .fg{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.chip{font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);background:var(--sunken);white-space:nowrap}
.chip.k-一般{background:var(--c-exam-soft);border-color:transparent;color:var(--c-exam)}
.chip.k-共テ併用{background:var(--c-exam-soft);border-color:var(--c-kyo);color:var(--c-exam)}
.chip.k-共テ利用{background:var(--c-kyo-soft);border-color:transparent;color:var(--c-kyo)}
.chip.k-国公立{background:var(--c-ann-soft);border-color:transparent;color:var(--c-ann)}
.chip.conf{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.dates{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin:6px 0}
.dates span{white-space:nowrap}
.dates i{font-style:normal;font-weight:700;margin-right:4px}
.t-apply i{color:var(--c-apply)} .t-ann i{color:var(--c-ann)} .t-proc i{color:var(--c-proc)} .t-exam i{color:var(--c-exam)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.ctrls select,.ctrls input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:13px;max-width:100%}
.ctrls .memo{flex:1 1 160px;min-width:0}
.warns{display:grid;gap:4px;margin-top:8px}
.w{font-size:12.5px;border-radius:6px;padding:4px 8px;background:var(--warn-soft);color:var(--warn)}
.w.bad{background:var(--danger-soft);color:var(--danger)}
.w.okw{background:var(--c-ann-soft);color:var(--c-ann)}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:14px}
@media (max-width:960px){.side{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{font-size:15px;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-bottom:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.d-apply{background:var(--c-apply)} .d-exam{background:var(--c-exam)} .d-ann{background:var(--c-ann)} .d-proc{background:var(--c-proc)} .d-kyo{background:var(--c-kyo)}
.export{display:grid;gap:8px}
.export .opts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}

/* calendars */
.month{margin-bottom:12px}
.month h4{font-family:var(--f-head);font-size:14px;margin:0 0 4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .hd{font-size:11px;text-align:center;color:var(--muted)}
.cal .hd.sun,.cal .day.sun .n{color:var(--danger)} .cal .hd.sat,.cal .day.sat .n{color:var(--ai)}
.cal .day{min-height:40px;border-radius:5px;background:var(--sunken);padding:2px 3px;font-size:11px;position:relative}
.cal .day.pad{background:transparent}
.cal .day .n{font-family:var(--f-num);font-size:11px}
.cal .day .dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:1px}
.cal .day .dots .dot{width:7px;height:7px;margin:0}
.cal .day.today{outline:2px solid var(--ai)}
.cal .day.kyo{background:var(--c-kyo-soft)}

/* 大学群の色（カレンダーのチップ） */
.g0{--gc:#b42335} .g1{--gc:#6b3fa0} .g2{--gc:#0f7c80} .g3{--gc:#c26a00} .g4{--gc:#7a5c2e} .g5{--gc:#2e8540} .g6{--gc:#c2417a} .g7{--gc:#1f4e9c} .g8{--gc:#5a6578} .g9{--gc:#8a6d00} .g10{--gc:#3d7a99} .g11{--gc:#9b4d2e} .g12{--gc:#4f7a28} .g13{--gc:#a0522d} .g14{--gc:#2f6f5e} .g15{--gc:#7d5ba6}
.uchip{display:inline-block;font-size:11.5px;line-height:1.45;padding:0 5px;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;
  background:color-mix(in srgb,var(--gc) var(--chipmix),var(--surface));color:var(--ink);font-weight:700}
.uchip:hover{border-color:var(--gc)}
.uchip.mine{border:1.5px solid var(--ink)}
.more{border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0 2px;text-decoration:underline}
.flabel{font-size:12px;color:var(--muted);font-weight:700;min-width:3.5em}
.ulist{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
.bigcal{display:grid;gap:16px}
.bigcal .month h4{font-size:16px;margin-bottom:6px}
.bigcal .cal{gap:3px}
.bigcal .cal .day{min-height:92px;padding:4px;border:1px solid transparent;background:var(--surface);border-color:var(--line)}
.bigcal .cal .day.pad{background:transparent;border-color:transparent}
.bigcal .cal .day.sel{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.bigcal .cal .day.kyo{background:var(--c-kyo-soft)}
.dn{display:flex;justify-content:space-between;align-items:baseline;width:100%;background:none;border:0;padding:0 0 2px;cursor:pointer}
.dn[disabled]{cursor:default}
.dn .n{font-family:var(--f-num);font-size:13px;font-weight:700}
.dn .c{font-size:11px;color:var(--muted)}
.day.sun .dn .n{color:var(--danger)} .day.sat .dn .n{color:var(--ai)}
.agenda{display:grid;gap:6px}
.arow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.arow.sel,.arow.today{border-color:var(--ai)}
.arow .ad{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:grid;font-family:var(--f-num)}
.arow .ad small{color:var(--muted);font-size:11px}
.ev{display:block;font-size:11px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;padding:0 3px;margin-top:2px}
.legend .ev{display:inline-block;margin:0}
.e-exam{background:var(--c-exam-soft);color:var(--c-exam);font-weight:700} .e-apply{background:var(--c-apply-soft);color:var(--c-apply)}
.e-ann{background:var(--c-ann-soft);color:var(--c-ann)} .e-proc{background:var(--c-proc-soft);color:var(--c-proc)} .e-kyo{background:var(--c-kyo-soft);color:var(--c-kyo);font-weight:700}
.agenda .ev{display:inline-block;margin:0 3px 3px 0}
.pcalwrap .month{margin-bottom:16px}
.pcalwrap .month h4{font-size:16px;margin-bottom:6px}
.pcalwrap .cal .day{min-height:78px;padding:3px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.pcalwrap .cal .day.pad{background:transparent;border-color:transparent}
.pcalwrap .cal .day.kyo{background:var(--c-kyo-soft)}

.aiout{white-space:pre-wrap;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:10px;font-size:14px;line-height:1.8}
.aiout .aih{display:block;font-family:var(--f-head);font-size:15px;margin-top:6px;color:var(--ai)}

.chk{margin:4px 0 8px;padding-left:1.2em;font-size:13px;line-height:1.7}
.chk.bad li{color:var(--danger)} .chk.warn li{color:var(--warn)}
.chkres p.bad{color:var(--danger)} .chkres p.ok{color:var(--ok)}
a.btn{text-decoration:none;color:inherit} a.btn.primary{color:var(--ai-ink)}

.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}

/* search */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--ai-ink);font-weight:700}
.search{flex:1 1 220px;min-width:0}
.unis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.uni{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left}
.uni:hover{border-color:var(--ai)}
.uni .nm{font-family:var(--f-head);font-weight:700;font-size:16px}
.uni .meta{font-size:12px;color:var(--muted)}
.uni .mine{font-size:11px;color:var(--c-exam);font-weight:700}
.grp-h{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:16px 0 6px;grid-column:1/-1}
details.fac{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
details.fac>summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
details.fac>summary::-webkit-details-marker{display:none}
details.fac>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.fac[open]>summary::before{transform:rotate(90deg)}
details.fac>summary .c{font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:400}
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--line)}
table.ex{border-collapse:collapse;width:100%;font-size:13px;min-width:980px}
table.ex td.sj{font-size:12px;min-width:230px;max-width:340px;line-height:1.45}
.sk{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:5px;white-space:nowrap}
.sk.sk-kt{background:var(--c-kyo-soft);color:var(--c-kyo)} .sk.sk-nt{background:var(--c-exam-soft);color:var(--c-exam)}
.sjline{font-size:12.5px;line-height:1.5;margin-top:4px}
.subjbar{background:var(--sunken);border-radius:10px;padding:8px 10px}
.subjchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip.sm{padding:3px 10px;font-size:12.5px}
.fchip.strong{border-color:var(--ai);color:var(--ai);font-weight:700}
.livedot{color:var(--c-ann);font-size:12px;animation:blink 2s infinite}

.ghst.warn{background:var(--warn-soft);color:var(--warn)} .ghst.wait{background:var(--sunken);color:var(--muted)}
.sortsel{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sortsel select{width:auto;padding:4px 8px;font-size:13px}

table.ex td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.ex td.d{white-space:nowrap;font-family:var(--f-num)}
table.ex tr.added td{background:var(--c-exam-soft)}
table.ex th:last-child,table.ex td:last-child{position:sticky;right:0;z-index:1;background:var(--surface);box-shadow:-8px 0 8px -8px rgba(0,0,0,.25)}

table.ex tr.added td:last-child{background:var(--c-exam-soft)}
.uhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.uhead h2{font-size:22px}
.kyo-days{font-size:13px;color:var(--muted)}

/* profile */
.pf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.pf{grid-template-columns:minmax(0,1fr)}}
.pf .panel h3{font-size:16px}
.kt{width:100%;border-collapse:collapse;font-size:14px}
.kt th,.kt td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.kt th{font-size:12px;color:var(--muted)}
.kt input{width:100%;max-width:90px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);font-family:var(--f-num)}
.kt input.nm{max-width:140px;font-family:var(--f-body)}
.kt tfoot td{font-weight:700;border-bottom:0}
.bar{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ai)}

.ttable{border-collapse:collapse;width:100%;font-size:13px;min-width:860px;background:var(--surface)}
.ttable th{position:sticky;top:0;background:var(--sunken);font-size:12px;color:var(--muted);text-align:left;padding:7px 8px;white-space:nowrap}
.ttable td{border-top:1px solid var(--line);padding:6px 8px;white-space:nowrap}
.ttable tr:hover td{background:var(--ai-soft)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.drawer{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer .in{width:min(760px,100%);height:100%;overflow:auto;background:var(--paper);padding:18px max(16px,env(safe-area-inset-right,0px)) 40px 18px}
.daylist details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px}
.daylist summary{cursor:pointer;padding:8px 12px;display:flex;gap:10px;align-items:center}
.daylist .names{padding:4px 12px 10px;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:14px;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

#print{display:none}

/* ---------- 受験予定 ---------- */
/* 同じ日の2つの入試が「同じ試験（1回の受験で併願できる）」かどうか */
const UNIFIED_RE = /全学|統一|共通|Ｎ全学|Ｎ方式|N方式|Ｔ日程|Ｔ方式|自由選択|学部共通|個別学部併願/;
function sittingOf(a, b) {
  if (a.uni !== b.uni) return 'other';
  const note = (a.note || '') + (b.note || '');
  if (/同時に受験可|同時受験可/.test(note)) return 'same';
  if (a.met === b.met && (a.fac === b.fac || UNIFIED_RE.test(a.met))) return 'same';
  return 'maybe';
}
function warningsFor(p, ps) {
  const x = exOf(p); const out = [];
  if (x.kind !== '共テ利用' && x.date) {
    const same = ps.filter(q => q !== p && !['取りやめ', '不合格'].includes(q.status) && exOf(q).kind !== '共テ利用' && exOf(q).date === x.date);
    const lv = same.map(q => [q, sittingOf(x, exOf(q))]);
    const L = k => lv.filter(v => v[1] === k).map(v => label(exOf(v[0]), true)).join('、');
    if (L('other')) out.push({ bad: true, t: `${fmt(x.date)}に ${L('other')} とも重なっています` });
    if (L('maybe')) out.push({ t: `${fmt(x.date)}に同じ大学の ${L('maybe')} もあります。同じ日に両方受けられるか（同じ試験で併願できるか）を要項で確認しましょう` });
    if (L('same')) out.push({ ok: true, t: `${L('same')} と同じ試験です。1回の受験で複数の学科に出願できる方式です（併願の条件・検定料は要項で確認）` });
  }
  if (x.close && x.close < today && !p.status) out.push({ bad: true, t: `出願締切（${fmt(x.close)}）を過ぎています` });
  else if (x.close && !p.status) {
    const dd = Math.round((dOf(x.close) - dOf(today)) / 864e5);
    if (dd >= 0 && dd <= 7) out.push({ t: `出願締切まであと${dd}日（${fmt(x.close)}）` });
  }
  if (x.proc) {
    const r = PREF_RANK[p.pref] ?? 9;
    const hi = ps.filter(q => q !== p && (PREF_RANK[q.pref] ?? 9) < r && exOf(q).ann && exOf(q).ann > x.proc);
    if (hi.length && r < 9) out.push({ t: `手続締切（${fmt(x.proc)}）が、${hi.map(q => `${label(exOf(q), true)}の発表（${fmt(exOf(q).ann)}）`).join('、')}より前です。入学金の扱いを確認しましょう` });
  }
  if (x.conf && !/確定/.test(x.conf)) out.push({ t: `日程は「${x.conf}」です。募集要項で確認してください` });
  return out;
}

function calMonths() {
  const s = M.settings.calStart || `${M.settings.year - 1 || 2026}-12-01`, e = M.settings.calEnd || `${M.settings.year || 2027}-03-31`;
  const out = []; let d = dOf(s); d.setDate(1); const end = dOf(e);
  while (d <= end) { out.push([d.getFullYear(), d.getMonth()]); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  return out;
}
function monthHTML(y, m, cell, cls = '') {
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  let h = `<div class="month ${cls}"><h4>${y}年${m + 1}月</h4><div class="cal">` + [...WD].map((w, i) => `<div class="hd${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</div>`).join('');
  for (let i = 0; i < first.getDay(); i++) h += `<div class="day pad"></div>`;
  for (let d = 1; d <= days; d++) { const iso = `${y}-${pad2(m + 1)}-${pad2(d)}`; h += cell(iso, new Date(y, m, d).getDay()); }
  return h + `</div></div>`;
}
const EV_SYM = { apply: '〆', exam: '◎', ann: '発', proc: '手' };
const EV_ORDER = ['exam', 'apply', 'ann', 'proc'];
function evLabel(e, long) {
  const x = e.x; let t = EV_SYM[e.type] + uniAbbr(x.uni);

  else if (long) t += ' ' + (x.kind === '共テ利用' ? '共テ利用' : x.met);

}
function eventMap(ps) {

  Object.values(map).forEach(a => a.sort((p, q) => EV_ORDER.indexOf(p.type) - EV_ORDER.indexOf(q.type)));

}
const isNarrow = () => window.innerWidth < 700;

function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }

}
function buildICS(st, types) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');

  const ps = (st.picks || []).filter(p => !['取りやめ', '不合格'].includes(p.status));
  const prefix = { apply: '【出願締切】', exam: '【試験】', ann: '【合格発表】', proc: '【手続締切】' };
  for (const e of ps.flatMap(eventsOf)) {
    if (!types.has(e.type)) continue;
    const x = e.x; const d = e.date.replace(/-/g, ''), d2 = addDays(e.date, 1).replace(/-/g, '');
    const desc = [`${label(x)}`, `方式：${x.met}（${x.kind}）`, x.date ? `試験日：${fmt(x.date)}` : '', `出願：${x.open ? fmt(x.open) + '〜' : ''}${fmt(x.close) || '要確認'}`, `合格発表：${fmt(x.ann) || '要確認'}`, `手続締切：${fmt(x.proc) || '要確認'}`, x.note, '※必ず募集要項で確認'].filter(Boolean).join('\n');
    L.push('BEGIN:VEVENT', `UID:${e.p.id}-${e.type}@jukenko-planner`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${d2}`,
      `SUMMARY:${icsEscape(prefix[e.type] + uniName(x.uni) + ' ' + facName(x.fac) + ' ' + x.met)}`, `DESCRIPTION:${icsEscape(desc)}`, 'TRANSP:TRANSPARENT');
    if (e.type === 'apply') L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape('出願締切まであと3日：' + uniName(x.uni))}`, 'TRIGGER:-P3D', 'END:VALARM');
    if (e.type === 'exam') L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape('明日は試験：' + uniName(x.uni))}`, 'TRIGGER:-PT9H', 'END:VALARM');
    L.push('END:VEVENT');
  }
  for (const k of M.settings.kyo) {
    L.push('BEGIN:VEVENT', `UID:kyotsu-${k}@jukenko-planner`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${k.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(k, 1).replace(/-/g, '')}`, 'SUMMARY:【試験】大学入学共通テスト', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');

}

async function importTexts(texts, quiet) {

/* Kei-Net 入試日一覧 → 入試日程 */
async function convertKeinet(files) {
  const out = []; const seen = new Set(); let skipped = 0;
  for (const f of files) {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const a = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    const hi = a.findIndex(r => String(r[0]).includes('ランク偏差値'));
    if (hi < 0) { skipped++; continue; }
    const head = a[hi].map(h => String(h).replace(/_x000D_/g, '').replace(/\s+/g, ' ').trim());
    let cur = '';
    for (const r of a.slice(hi + 1)) {
      if (r[0] !== '' && r[0] != null) cur = normDate(r[0]) || cur;
      for (let j = 1; j < r.length; j++) {
        const cell = String(r[j] || '').replace(/_x000D_/g, ''); if (!cell.trim()) continue;
        for (let s of cell.split(/\n/)) {
          s = s.trim(); if (!s) continue;
          const m = s.match(/^【(.+?)】(.*)$/); if (!m || !cur) { skipped++; continue; }
          const uni = m[1]; let rest = m[2]; const notes = [];
          if (rest.includes('[自]')) notes.push('試験日自由選択（他日程でも受験可）');
          const mm = rest.match(/<(.+?)>/); if (mm) notes.push(mm[1]);
          rest = rest.replace(/<.+?>/g, '').replace(/\[自\]|\[指\]/g, '').trim();
          const p = rest.split('-'); let fac = p[0], dep = '', met = '一般';
          if (p.length >= 3) { dep = p[1]; met = p.slice(2).join('-'); } else if (p.length === 2) { if (/方式|日程|全学|学部|統一|英語|技能|科目|教科|型|コア|プラス|期|共通|併用|利用/.test(p[1])) met = p[1]; else dep = p[1]; }
          const kind = met.includes('(テ)') ? '共テ併用' : '一般'; met = met.replace('(テ)', '');
          const rk = (head[j] || '').match(/([\d.]+～[\d.]+)/); const rank = rk ? rk[1] : (head[j].includes('設定') ? '設定なし' : head[j]);
          const key = [uni, fac, dep, met, cur].join('|'); if (seen.has(key)) continue; seen.add(key);
          const grp = (M.uniInfo[uni] && M.uniInfo[uni].grp) || '';
          out.push({ id: '', grp, uni, fac, dep, met, kind, date: cur, open: '', close: '', ann: '', proc: '', rank, note: notes.join('／'), conf: '要確認', src: 'Kei-Net入試日一覧' });
        }
      }
    }
  }
  STATE.teacher.conv = { rows: out, files: files.length, skipped, unis: new Set(out.map(x => x.uni)).size };
  render();
}

  if (t.id === 's-fq') { STATE.search.fq = t.value; clearTimeout(t._tm); t._tm = setTimeout(() => keepFocus('s-fq', rerenderTab), 250); return; }
  if (t.id === 'k-fq') { STATE.kyo.fq = t.value; clearTimeout(t._tm); t._tm = setTimeout(() => keepFocus('k-fq', rerenderTab), 250); return; }
  if (t.id === 'c-q') { STATE.cal.q = t.value; clearTimeout(t._tm); t._tm = setTimeout(() => keepFocus('c-q', rerenderTab), 250); return; }
  if (t.id === 't-q') { STATE.teacher.q = t.value; keepFocus('t-q', render); return; }
  if (t.id === 't-addq') { STATE.teacher.addq = t.value; const el = $('#t-addres'); if (el) el.innerHTML = tAddResultsHTML(t.dataset.key, t.value); return; }
  if (t.id === 'fb-rule-email') { const r = $('#fb-rules'); if (r) r.value = fbRules(t.value); return; }
  if (t.id === 'ai-template') { const a = loadAI(); a.template = t.value; saveAI(a); return; }
  if (!STATE.me) return;
  const pf = STATE.me.profile;
  if (d.p) { pf[d.p] = t.type === 'checkbox' ? t.checked : t.value; touch(); return; }
  if (d.ext !== undefined) { pf.ext = pf.ext || [{}, {}]; pf.ext[+d.ext] = pf.ext[+d.ext] || {}; pf.ext[+d.ext][d.k] = t.value; touch(); return; }
  if (d.kyo) {
    pf.kyo = pf.kyo || {}; pf.kyo[d.kyo] = pf.kyo[d.kyo] || {}; pf.kyo[d.kyo][d.k] = d.k === 'n' ? t.value : t.value.replace(/[^\d.]/g, ''); touch();
    const r = kyoTotals(pf); $('#kt-max').textContent = r.mx || ''; $('#kt-tg').textContent = r.mx ? `${r.tg}（${Math.round(r.tg / r.mx * 100)}%）` : ''; $('#kt-mk').textContent = r.mkMax ? `${r.mk}（${Math.round(r.mk / r.mkMax * 100)}%）` : ''; $('#kt-bar').style.width = (r.mx ? Math.round(r.tg / r.mx * 100) : 0) + '%';
    return;
  }
  if (d.f === 'memo') { const el = t.closest('.pick'); STATE.me.picks[+el.dataset.i].memo = t.value; touch(); }
}
document.addEventListener('change', e => {
  const t = e.target; const d = t.dataset;
  if (t.id === 't-cls') { STATE.teacher.cls = t.value; render(); return; }
  if (t.id === 'pdf-withcal' || t.id === 't-withcal') { STATE.pdfCal = t.checked; return; }
  if (t.name === 'clsmode') { STATE.clsPdfMode = t.value; return; }
  if (t.id === 'sortsel') { STATE.sort = t.value; rerenderTab(); return; }
  if (t.dataset.ai) { const a = loadAI(); a[t.dataset.ai] = t.type === 'checkbox' ? t.checked : t.value; saveAI(a); return; }
  if (t.id === 'chk-file' && t.files.length) { checkFile(t.files[0]); return; }
  if (t.id === 'kn-files' && t.files.length) { convertKeinet([...t.files]); return; }
  if (!STATE.me) return;
  if (d.p && t.tagName === 'SELECT') { STATE.me.profile[d.p] = t.value; touch(); return; }
  if (d.ext !== undefined && t.tagName === 'SELECT') { const pf = STATE.me.profile; pf.ext = pf.ext || [{}, {}]; pf.ext[+d.ext] = pf.ext[+d.ext] || {}; pf.ext[+d.ext].type = t.value; touch(); return; }
  if (['pref', 'status', 'date'].includes(d.f)) {
    const el = t.closest('.pick'); const p = STATE.me.picks[+el.dataset.i]; p[d.f] = t.value; touch();
    const y = window.scrollY; rerenderTab(); window.scrollTo({ top: y }); refreshCounts();
    const hd = $('.strip'); if (hd) hd.outerHTML = summaryHTML(STATE.me);
  }
});

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && STATE.view === 'student') stuSync(); });
let lastNarrow = null;
window.addEventListener('resize', () => { const n = isNarrow(); if (lastNarrow !== null && n !== lastNarrow && STATE.view === 'student' && ['cal', 'plan'].includes(STATE.tab)) rerenderTab(); lastNarrow = n; });

/* ============================================================
   起動
   ============================================================ */
(async function boot() {
  const app = $('#app');
  if (typeof XLSX === 'undefined') { app.innerHTML = `<div class="login"><h1>受験校プランナー</h1><p class="err-msg">表計算ライブラリを読み込めませんでした。インターネットに接続して再読み込みしてください。</p></div>`; return; }
  await loadConfigFile();
  try {
    await loadMaster(); if (!restoreUI()) render();
  }
  catch (e) {
    app.innerHTML = `<div class="login"><h1>受験校プランナー</h1><p class="err-msg">大学データ（${esc(C.MASTER_URL)}）を読み込めませんでした。</p>
      <p class="note">パソコンでファイルを直接開いている場合は、下から master.xlsx を選ぶと動作を確認できます。GitHub Pagesに置いた場合は data フォルダに master.xlsx があるか確認してください。</p>
      <input type="file" id="mf" accept=".xlsx" class="inp"></div>`;
    $('#mf').addEventListener('change', async ev => { const f = ev.target.files[0]; if (!f) return; ingestWorkbook(XLSX.read(await f.arrayBuffer(), { type: 'array' })); render(); });
  }
})();
</script>
</body>
</html>
